  <!-- Theme pre-paint: apply the saved colour theme before CSS loads (no flash).
       Government also starts fetching Inter here.
       First-ever visit = Default (OS light/dark preference is ignored). -->
  <!-- Theme: a ?style=dark|gov link (or /gov/…, /dark/… via vercel.json) wins over the saved choice and is saved; otherwise use localStorage. -->
  <script>(function(){try{var t,q=/[?&]style=(dark|gov)(?=&|$)/i.exec(location.search);if(q){t=q[1].toLowerCase();try{localStorage.setItem('ff-theme',t)}catch(e){}try{history.replaceState(history.state,'',location.pathname+location.search.replace(/([?&])style=[^&]*&?/i,'$1').replace(/[?&]$/,'')+location.hash)}catch(e){}}else t=localStorage.getItem('ff-theme');if(t==='dark'||t==='gov')document.documentElement.setAttribute('data-theme',t);if(t==='gov'){var l=document.createElement('link');l.id='gov-font';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap';document.head.appendChild(l);}}catch(e){}})();</script>

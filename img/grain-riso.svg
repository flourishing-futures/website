<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260">
  <!-- Opaque grey noise centred on mid-grey so a soft-light overlay textures
       symmetrically (both light + dark speckle) WITHOUT washing colours lighter.
       numOctaves=2 gives a fuzzier, cloudier riso grain than a single octave. -->
  <filter id="riso" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="7" result="t"/>
    <feColorMatrix in="t" type="saturate" values="0" result="g"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.9" intercept="0.05"/>
      <feFuncG type="linear" slope="0.9" intercept="0.05"/>
      <feFuncB type="linear" slope="0.9" intercept="0.05"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#riso)"/>
</svg>
